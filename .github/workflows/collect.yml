name: 자동 수집 (올영/쿠팡)

on:
  schedule:
    # 매일 07:00 KST = 전날 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼도 활성화

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 올리브영 수집
        run: python scripts/collect_oliveyoung.py

      - name: 쿠팡 수집
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python scripts/collect_coupang.py

      - name: data.json 병합
        run: python scripts/merge_to_data_json.py

      - name: 변경사항 커밋
        run: |
          git config user.name "auto-collect-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: 자동 수집 결과 갱신 $(date -u +%Y-%m-%d)"
          git push

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLS 마진·정산 시뮬레이터 v2</title>
<style>
  :root{--ink:#2c2c2a;--sub:#5f5e5a;--line:#e6e6e3;--bg:#f4f2ef;--pink:#d4537e;--dark:#22272b;--go:#1d9e75;--review:#ba7517;--no:#d63031;--orange:#ee4d2d;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);line-height:1.55;}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .head{background:var(--dark);color:#fff;padding:22px 26px;}
  .stripe{width:46px;height:3px;border-radius:2px;background:var(--pink);margin-bottom:12px;}
  .cat{color:#a7adb2;font-size:11px;letter-spacing:1.5px;}
  .ttl{font-size:20px;font-weight:500;margin-top:5px;}
  .sub{color:#a7adb2;font-size:12px;margin-top:6px;}
  .body{padding:22px 26px;}
  .inputs{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding:16px;background:#fbfbfa;border:1px solid var(--line);border-radius:8px;margin-bottom:20px;}
  .fld{display:flex;flex-direction:column;gap:4px;}
  .fld label{font-size:11px;color:var(--sub);}
  .fld input,.fld select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;width:140px;}
  .fld .rng{width:200px;}
  h3.sec{font-size:15px;color:var(--pink);border-left:3px solid var(--pink);padding-left:8px;margin:24px 0 10px;}
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{text-align:left;padding:7px 6px;border-bottom:2px solid #f4c0d1;color:#993556;font-weight:600;}
  tbody td{padding:6px;border-bottom:1px solid #f3f1ee;}
  td.r{text-align:right;} td.c{text-align:center;}
  .v-GO{color:var(--go);font-weight:700;} .v-REVIEW{color:var(--review);font-weight:700;} .v-NO{color:var(--no);}
  .kpis{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 4px;}
  .kpi{background:#f7f7f5;border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:150px;}
  .kpi b{display:block;font-size:20px;font-weight:700;}
  .kpi span{font-size:11px;color:var(--sub);}
  .breakdown td:first-child{color:var(--sub);}
  .pos{color:var(--go);font-weight:700;} .neg{color:var(--no);font-weight:700;}
  .note{font-size:11.5px;color:var(--sub);}
  .foot{font-size:11px;color:#aaa;border-top:1px solid var(--line);padding-top:12px;margin-top:24px;}
  .flag{font-size:10px;padding:1px 6px;border-radius:8px;background:#f0e6cf;color:#7a5b12;margin-left:4px;}
  .box{border-left:4px solid var(--orange);background:#fdf1ed;border-radius:0 6px 6px 0;padding:12px 16px;margin:16px 0;font-size:12.5px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="stripe"></div>
      <div class="cat">SHOPEE K-BEAUTY · SLS 마진·정산 시뮬레이터 v2</div>
      <div class="ttl">실제 쇼피 물류(SLS) 배송비 + 마켓별 수수료 반영</div>
      <div class="sub">EMS 가정이 아니라 쇼피 공식 SLS 요율표·정산 수수료 기준 — 가벼운 상품의 실제 마진을 보여줍니다.</div>
    </div>
    <div class="body">
      <div class="inputs">
        <div class="fld"><label>원가 (사입+국내배송+포장, KRW)</label><input id="cost" type="number" value="14000"></div>
        <div class="fld"><label>청구 무게 (g, 실/부피 중 큰값)</label><input id="weight" type="number" value="50"></div>
        <div class="fld"><label>목표 마진 <b id="mlabel">25%</b></label><input id="margin" class="rng" type="range" min="0" max="50" value="25"></div>
      </div>

      <h3 class="sec">① 마켓별 권장판매가 · 판정 (오늘 원가/무게 기준)</h3>
      <div class="note" id="fxnote"></div>
      <table>
        <thead><tr><th>마켓</th><th class="r">SLS 판매자배송비</th><th class="r">총수수료</th><th class="r">권장판매가(현지)</th><th class="r">권장판매가(KRW)</th><th class="r">정산후 마진</th><th class="c">판정</th></tr></thead>
        <tbody id="mrows"></tbody>
      </table>
      <p class="note" style="margin-top:8px"><span class="flag">추정</span> 표시 마켓은 SLS 배송비는 실측, 수수료는 셀퍼스 추정치입니다(정식 정산시트 미반영). SG·PH는 공식 정산시트 기준 실값.</p>

      <h3 class="sec">② 정산 상세 (선택 마켓)</h3>
      <div class="fld" style="margin-bottom:12px"><label>마켓 선택</label><select id="msel"></select></div>
      <div class="kpis" id="kpis"></div>
      <table class="breakdown"><tbody id="bd"></tbody></table>

      <div class="box" id="insight"></div>

      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>

<script>
/* ===== 마켓 설정 =====
   ship(w): 판매자 부담 SLS 배송비 (현지통화), w=청구무게(g)
   fee: 판매수수료+PG+서비스+GST 합 (% of 최종판매가) / wd: 인출수수료%
   fx: 현지통화 1단위 = ? KRW (당일 변동 — 상단에서 조정 가능하도록 향후 확장)
   src: 'full'=정산시트 실값, 'ship'=배송비만 실측·수수료 추정, 'stub'=골격(EMS 폴백)
*/
const EMS = w => w<=100?10800:w<=200?12600:w<=300?14400:w<=500?17500:23000; // KRW fallback
const MK = {
  SG:{name:'싱가포르',cur:'SGD',fx:920, fee:28.15, wd:1.2, src:'full',
      ship:w=> +(0.80 + Math.max(0,Math.ceil((w-50)/10))*0.08).toFixed(2),
      note:'판매 15.35%+PG 3%+서비스 0.8%+GST 9% · 인출 1.2% · SLS 2026.06.01~'},
  PH:{name:'필리핀',cur:'PHP',fx:24.6, fee:12.0, wd:1.2, src:'full',
      ship:w=> 23 + Math.max(0,Math.ceil((w-50)/50))*15,
      note:'판매 9.01%+PG ~3% · 인출 1.2% · 감면 ₱40 고정 · SLS ~2026.06.30'},
  TW:{name:'대만',cur:'TWD',fx:43, fee:10.5, wd:1.2, src:'ship',
      ship:w=> +Math.max(1.3, w*0.13).toFixed(1),
      note:'SLS cross-border 실측(NT$0.13/g) · 수수료 추정'},
  VN:{name:'베트남',cur:'VND',fx:0.054, fee:19.55, wd:1.2, src:'ship',
      ship:w=> w<=50?5500: w*110,
      note:'SLS 실측(≤50g 5,500 / +110₫·g) · 수수료 추정'},
  MY:{name:'말레이시아',cur:'MYR',fx:300, fee:19.55, wd:1.2, src:'stub', ship:null, note:'요율시트 추출 예정 — EMS 폴백'},
  TH:{name:'태국',cur:'THB',fx:40, fee:19.55, wd:1.2, src:'stub', ship:null, note:'요율시트 추출 예정 — EMS 폴백'},
  BR:{name:'브라질',cur:'BRL',fx:250, fee:20.0, wd:1.2, src:'stub', ship:null, note:'요율시트 추출 예정 — EMS 폴백'},
  MX:{name:'멕시코',cur:'MXN',fx:75, fee:19.55, wd:1.2, src:'stub', ship:null, note:'요율시트 추출 예정 — EMS 폴백'},
};
const won = n => Math.round(n).toLocaleString('ko-KR');
const loc = (n,cur) => (Math.round(n*100)/100).toLocaleString('en-US')+' '+cur;

function shipKRW(m,w){ // 판매자부담 배송비 KRW
  if(m.ship) return m.ship(w)*m.fx;
  return EMS(w); // stub: EMS KRW
}
function calc(code,cost,w,margin){
  const m=MK[code];
  const shipLoc = m.ship? m.ship(w): null;
  const shipKr = shipKRW(m,w);
  const costLoc = cost/m.fx;
  const denom = 1 - m.fee/100 - m.wd/100 - margin/100;
  const totalCostLoc = costLoc + (shipLoc!=null?shipLoc:shipKr/m.fx);
  const priceLoc = denom>0 ? totalCostLoc/denom : Infinity;
  const priceKr = priceLoc*m.fx;
  const marginKr = priceKr*margin/100;
  return {m,shipLoc,shipKr,priceLoc,priceKr,marginKr,
    feeKr:priceKr*m.fee/100, wdKr:priceKr*m.wd/100, costKr:cost};
}
function verdict(margin){ return margin>=25?'GO':margin>=15?'REVIEW':'NO'; }

function render(){
  const cost=+document.getElementById('cost').value||0;
  const w=+document.getElementById('weight').value||0;
  const margin=+document.getElementById('margin').value||0;
  document.getElementById('mlabel').textContent=margin+'%';
  document.getElementById('fxnote').textContent='환율(현지1=KRW, 추정): '+Object.keys(MK).map(k=>k+' '+MK[k].fx).join(' · ')+'  ※ 당일 환율로 조정 필요';

  let h='';
  Object.keys(MK).forEach(code=>{
    const r=calc(code,cost,w,margin); const m=r.m;
    const v=verdict(margin); // 목표마진을 채운 권장가이므로 판정은 권장가/원가비율로 보정
    // 판정: 권장가가 원가의 몇 배인지 (낮을수록 경쟁력) — 1.6배 이하 GO, 2.2 이하 REVIEW
    const ratio = r.priceKr/cost;
    const vv = ratio<=1.6?'GO':ratio<=2.2?'REVIEW':'NO';
    const flag = m.src!=='full'?'<span class="flag">'+(m.src==='ship'?'추정':'골격')+'</span>':'';
    h+='<tr><td>'+m.name+flag+'</td>'
      +'<td class="r">'+(r.shipLoc!=null?loc(r.shipLoc,m.cur)+'<br><span class=note>≈₩'+won(r.shipKr)+'</span>':'₩'+won(r.shipKr)+' <span class=note>(EMS)</span>')+'</td>'
      +'<td class="r">'+(m.fee+m.wd).toFixed(1)+'%</td>'
      +'<td class="r">'+loc(r.priceLoc,m.cur)+'</td>'
      +'<td class="r">₩'+won(r.priceKr)+'</td>'
      +'<td class="r">₩'+won(r.marginKr)+'</td>'
      +'<td class="c"><span class="v-'+vv+'">'+vv+'</span></td></tr>';
  });
  document.getElementById('mrows').innerHTML=h;
  renderDetail();
}
function renderDetail(){
  const cost=+document.getElementById('cost').value||0;
  const w=+document.getElementById('weight').value||0;
  const margin=+document.getElementById('margin').value||0;
  const code=document.getElementById('msel').value;
  const r=calc(code,cost,w,margin); const m=r.m;
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><b>'+loc(r.priceLoc,m.cur)+'</b><span>권장 판매가(현지)</span></div>'
    +'<div class="kpi"><b>₩'+won(r.priceKr)+'</b><span>권장 판매가(KRW)</span></div>'
    +'<div class="kpi"><b class="pos">₩'+won(r.marginKr)+'</b><span>정산후 마진</span></div>'
    +'<div class="kpi"><b>'+(r.shipLoc!=null?loc(r.shipLoc,m.cur):'₩'+won(r.shipKr))+'</b><span>판매자 배송비</span></div>';
  document.getElementById('bd').innerHTML=
    row('원가 (사입+국내+포장)','₩'+won(cost))
    +row('SLS 판매자부담 배송비',(r.shipLoc!=null?loc(r.shipLoc,m.cur)+' (≈₩'+won(r.shipKr)+')':'₩'+won(r.shipKr)+' EMS폴백'))
    +row('총원가','₩'+won(cost+r.shipKr))
    +row('쇼피 수수료+PG+서비스+GST ('+m.fee+'%)','−₩'+won(r.feeKr))
    +row('인출수수료 ('+m.wd+'%)','−₩'+won(r.wdKr))
    +row('<b>권장 판매가</b>','<b>₩'+won(r.priceKr)+'</b>')
    +row('<b>정산후 마진 ('+margin+'%)</b>','<b class="pos">₩'+won(r.marginKr)+'</b>');
  document.getElementById('insight').innerHTML='<b>'+m.name+'</b> — '+m.note
    + '<br>EMS 가정(₩'+won(EMS(w))+', '+w+'g)과 비교해 SLS 판매자부담은 '
    + (r.shipLoc!=null? '약 ₩'+won(r.shipKr)+' — EMS의 '+(r.shipKr/EMS(w)*100).toFixed(0)+'% 수준.' : 'EMS 폴백(요율 추출 전).');
}
function row(a,b){return '<tr><td>'+a+'</td><td class="r">'+b+'</td></tr>';}

// init market select
const sel=document.getElementById('msel');
Object.keys(MK).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=MK[k].name+(MK[k].src!=='full'?' (추정)':'');sel.appendChild(o);});
sel.value='PH';
['cost','weight','margin'].forEach(id=>document.getElementById(id).addEventListener('input',render));
sel.addEventListener('change',renderDetail);
document.getElementById('foot').innerHTML='SLS 배송비 출처: Shopee KR 마켓별 해외배송비 요율표(구글시트, 2026-06-08 기준) · 정산 수수료: 쇼피코리아 수수료 반영·정산 처리 예시 파일(202605) · ⚠ PH 현행 요율은 2026.07.01부터 신요율 적용 예정 · 환율은 추정치로 당일 확인 필요 · TW·VN 수수료 및 MY·TH·BR·MX 요율은 추가 추출 예정.';
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼피 K뷰티 시장조사 대시보드</title>
<style>
  :root{
    --ink:#2c2c2a; --sub:#5f5e5a; --line:#e6e6e3; --bg:#f4f2ef;
    --pink:#d4537e; --dark:#22272b; --go:#1d9e75; --review:#ba7517; --no:#d63031; --exc:#999;
    --orange:#ee4d2d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);line-height:1.55;}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  /* header */
  .head{background:var(--dark);color:#fff;padding:22px 26px;}
  .stripe{width:46px;height:3px;border-radius:2px;background:var(--pink);margin-bottom:12px;}
  .cat{color:#a7adb2;font-size:11px;letter-spacing:1.5px;}
  .ttl{font-size:20px;font-weight:500;margin-top:5px;}
  .kpis{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;}
  .kpi{}
  .kpi b{display:block;font-size:22px;font-weight:600;}
  .kpi span{font-size:11px;color:#a7adb2;}
  /* controls */
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px 26px;border-bottom:1px solid var(--line);background:#fbfbfa;}
  .controls .lbl{font-size:12px;color:var(--sub);margin-right:4px;}
  .tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 13px;border-radius:18px;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .tab:hover{border-color:var(--pink);}
  .tab.active{background:var(--dark);color:#fff;border-color:var(--dark);}
  .tab.go.active{background:var(--go);border-color:var(--go);}
  /* body */
  .body{padding:22px 26px;}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
  .bdg{font-size:11px;border-radius:11px;padding:4px 11px;}
  .bdg.go{background:var(--go);color:#fff;}
  .bdg.review{background:#ef9f27;color:#412402;}
  .bdg.exc{background:#3a4045;color:#cdd2d6;}
  .bdg.no{background:#3a4045;color:#cdd2d6;}
  .note{font-size:12px;color:var(--sub);margin:0 0 16px;}
  h3.sec{font-size:15px;color:var(--pink);border-left:3px solid var(--pink);padding-left:8px;margin:26px 0 10px;}
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{text-align:left;padding:7px 6px;border-bottom:2px solid #f4c0d1;color:#993556;font-weight:600;}
  tbody td{padding:6px;border-bottom:1px solid #f3f1ee;}
  td.r{text-align:right;}
  td.c{text-align:center;}
  .v-GO{color:var(--go);font-weight:700;}
  .v-REVIEW{color:var(--review);font-weight:700;}
  .v-NO{color:var(--no);}
  .v-제외{color:var(--exc);}
  sup{font-size:9px;color:var(--sub);}
  .box{border-radius:0 6px 6px 0;padding:13px 16px;margin:16px 0;font-size:13px;}
  .box .bt{font-weight:700;font-size:13.5px;margin-bottom:6px;}
  .box.gobox{border-left:4px solid var(--go);background:#f3fbf8;}
  .box.gobox .bt{color:#0f6e56;}
  .box.empty{background:#f3f3f1;color:var(--sub);}
  .box.action{border-left:4px solid var(--orange);background:#fdf1ed;}
  .box.action .bt{color:var(--orange);}
  .box ol{margin:0;padding-left:18px;}
  .box li{margin-bottom:6px;}
  .rc{font-size:12.5px;margin:3px 0;}
  .rc .k{display:inline-block;width:74px;font-weight:700;}
  .rc.up .k{color:var(--go);} .rc.down .k{color:var(--no);}
  .rc.new .k{color:#0984e3;} .rc.out .k{color:var(--exc);}
  .foot{font-size:11px;color:#aaa;border-top:1px solid var(--line);padding-top:12px;margin-top:24px;}
  .gostat{font-size:12px;color:var(--sub);margin:-6px 0 14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="stripe"></div>
      <div class="cat">SHOPEE K-BEAUTY · 시장조사 대시보드</div>
      <div class="ttl" id="ttl">쇼피 K뷰티 시장조사 · 신진우님</div>
      <div class="kpis">
        <div class="kpi"><b id="k-days">–</b><span>트래킹 일수</span></div>
        <div class="kpi"><b id="k-latest">–</b><span>최신 브리핑</span></div>
        <div class="kpi"><b id="k-go" style="color:#7fe3c0">–</b><span>누적 GO</span></div>
        <div class="kpi"><b id="k-review" style="color:#f4c879">–</b><span>누적 REVIEW</span></div>
      </div>
    </div>
    <div class="controls" id="controls">
      <span class="lbl">브리핑</span>
      <div id="tabs" style="display:contents"></div>
    </div>
    <div class="body" id="view"></div>
  </div>
</div>

const won = n => n.toLocaleString('ko-KR');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// KPI
const B = DATA.briefings;
document.getElementById('k-days').textContent = B.length;
document.getElementById('k-latest').textContent = B.length ? B[B.length-1].date.slice(5).replace('-','/') : '–';
document.getElementById('k-go').textContent = B.reduce((s,b)=>s+b.counts.go,0);
document.getElementById('k-review').textContent = B.reduce((s,b)=>s+b.counts.review,0);

// Tabs
const tabsEl = document.getElementById('tabs');
B.forEach((b,i)=>{
  const t=document.createElement('button');
  t.className='tab'; t.textContent=b.date.slice(5).replace('-','/')+' ('+b.dayLabel+')';
  t.onclick=()=>{setActive(t);renderDay(b);};
  tabsEl.appendChild(t);
});
const goTab=document.createElement('button');
goTab.className='tab go'; goTab.textContent='★ GO 모아보기';
goTab.onclick=()=>{setActive(goTab);renderGoOnly();};
tabsEl.appendChild(goTab);

function setActive(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}

function verdictCell(v,markets){
  const m = markets ? '<sup>'+esc(markets)+'</sup>' : '';
  return '<span class="v-'+v+'">'+esc(v)+m+'</span>';
}

function top10Table(rows){
  let h='<table><thead><tr><th>#</th><th>브랜드</th><th>상품</th><th class="r">세일가</th><th class="c">판정</th></tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><td>'+r.rank+'</td><td>'+esc(r.brand)+'</td><td>'+esc(r.name)+'</td><td class="r">'+won(r.salePrice)+'</td><td class="c">'+verdictCell(r.verdict,r.markets)+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function renderDay(b){
  let h='';
  h+='<div class="badges">'
    +'<span class="bdg go">GO '+b.counts.go+'</span>'
    +'<span class="bdg review">REVIEW '+b.counts.review+'</span>'
    +'<span class="bdg exc">제외 '+b.counts.exclude+'</span>'
    +'<span class="bdg no">NO '+b.counts.no+'</span></div>';
  h+='<p class="note">'+esc(b.trackingNote)+'</p>';

  h+='<h3 class="sec">① 올리브영 세일 랭킹 TOP 10 · 판정</h3>'+top10Table(b.top10);

  if(b.goHighlights && b.goHighlights.length){
    h+='<div class="box gobox"><div class="bt">★ GO / 최고 마진 후보</div>';
    h+=b.goHighlights.map(esc).join('<br>')+'</div>';
  }else{
    h+='<div class="box empty">오늘 GO 없음</div>';
  }

  const rc=b.rankChanges||{};
  const hasRC=(rc.up&&rc.up.length)||(rc.down&&rc.down.length)||(rc.new&&rc.new.length)||(rc.out&&rc.out.length);
  if(hasRC){
    h+='<h3 class="sec">② 전일 대비 순위 변동</h3>';
    if(rc.up&&rc.up.length)  h+='<div class="rc up"><span class="k">▲ 상승</span>'+esc(rc.up.join(', '))+'</div>';
    if(rc.down&&rc.down.length)h+='<div class="rc down"><span class="k">▼ 하락</span>'+esc(rc.down.join(', '))+'</div>';
    if(rc.new&&rc.new.length) h+='<div class="rc new"><span class="k">＋ 신규</span>'+esc(rc.new.join(', '))+'</div>';
    if(rc.out&&rc.out.length) h+='<div class="rc out"><span class="k">－ 이탈</span>'+esc(rc.out.join(', '))+'</div>';
  }

  h+='<h3 class="sec">③ 쇼피 SG 베스트 × 올영 매칭</h3>';
  h+='<table><thead><tr><th>SG 베스트</th><th class="r">SG가</th><th class="c">월판매</th><th class="c">매칭/판정</th></tr></thead><tbody>';
  b.sg.forEach(s=>{ h+='<tr><td>'+esc(s.name)+'</td><td class="r">'+esc(s.price)+'</td><td class="c">'+esc(s.sold)+'</td><td class="c">'+esc(s.match)+'</td></tr>'; });
  h+='</tbody></table>';
  if(b.sgNote) h+='<p class="note" style="margin-top:8px">'+esc(b.sgNote)+'</p>';

  if(b.nextActions && b.nextActions.length){
    h+='<div class="box action"><div class="bt">다음 액션</div><ol>'+b.nextActions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ol></div>';
  }

  h+='<p class="foot">'+esc(DATA.meta.feeModel)+'<br>'+esc(DATA.meta.note)+'</p>';
  document.getElementById('view').innerHTML=h;
}

function renderGoOnly(){
  const rows=[];
  B.forEach(b=>{
    b.top10.filter(r=>r.verdict==='GO'||r.verdict==='REVIEW').forEach(r=>{
      rows.push(Object.assign({date:b.date.slice(5).replace('-','/')},r));
    });
  });
  let h='<h3 class="sec">★ 전체 기간 GO / REVIEW 모아보기</h3>';
  h+='<p class="gostat">트래킹 전 기간에서 GO 또는 REVIEW 판정을 받은 SKU 모음 ('+rows.length+'건). 시장조사용 후보 풀.</p>';
  if(!rows.length){ h+='<div class="box empty">아직 GO/REVIEW 후보가 없습니다.</div>'; }
  else{
    h+='<table><thead><tr><th>날짜</th><th>브랜드</th><th>상품</th><th class="r">세일가</th><th class="c">판정</th></tr></thead><tbody>';
    rows.forEach(r=>{ h+='<tr><td>'+r.date+'</td><td>'+esc(r.brand)+'</td><td>'+esc(r.name)+'</td><td class="r">'+won(r.salePrice)+'</td><td class="c">'+verdictCell(r.verdict,r.markets)+'</td></tr>'; });
    h+='</tbody></table>';
  }
  h+='<p class="foot">'+esc(DATA.meta.feeModel)+'</p>';
  document.getElementById('view').innerHTML=h;
}

// init: show latest day
if(B.length){ const last=tabsEl.querySelectorAll('.tab')[B.length-1]; setActive(last); renderDay(B[B.length-1]); }
</script>
